# Builds the VST3 plugin for Linux and Windows and publishes a GitHub release.
#   git tag v1.3.0 && git push origin v1.3.0      (or run it by hand: Actions -> Release)
#
# HISE can only export on the host OS it runs on, and there is no silent installer for the
# Windows HISE. So the Linux job exports the project once (HISE CLI), compiles the Linux VST3
# and hands the exported project (Binaries/) to the Windows job, which only re-saves it with
# Projucer and compiles it with MSBuild.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release (every build is released; off only for a test run)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: [vst3, standalone]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: echo "version=$(sed -n 's/.*<Version value="\([^"]*\)".*/\1/p' project_info.xml)" >> "$GITHUB_OUTPUT"

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config xvfb rsync \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libcurl4-openssl-dev \
            libx11-dev libxinerama-dev libxext-dev libxrandr-dev libxcursor-dev \
            libgl1-mesa-dev libgtk-3-dev

      - name: HISE 4.1.0 (+ patches)
        run: .github/hise-setup.sh

      - name: Export (HISE)
        run: |
          if [ "${{ matrix.target }}" = vst3 ]; then TYPE="-t:instrument -p:VST3"; else TYPE="-t:standalone"; fi
          xvfb-run -a "$PWD/../HISE/HISE Standalone" export "$PWD/XmlPresetBackups/JX808.xml" \
            -h:"$(cd ../HISE/source && pwd)" $TYPE -nolto
          test -f Binaries/AutogeneratedProject.jucer

      - name: Hand the exported project to Windows
        run: |
          # absolute paths in the .jucer are rewritten on Windows
          echo "$(cd .. && pwd)" > Binaries/linux-root.txt
          tar czf win-project.tgz Binaries
      - uses: actions/upload-artifact@v4
        with:
          name: win-project-${{ matrix.target }}
          path: win-project.tgz

      - name: Compile (Linux)
        run: |
          cd Binaries
          ../../HISE/source/tools/projucer/Projucer --resave AutogeneratedProject.jucer
          make -C Builds/LinuxMakefile CONFIG=Release AR=gcc-ar CPPFLAGS=-DJUCE_USE_CURL=0 -j"$(nproc)"

      - name: Validate (pluginval)
        if: matrix.target == 'vst3'
        run: |
          curl -L --fail -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip
          unzip -o -q pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 5 --timeout-ms 600000 \
            --validate "$PWD/Binaries/Builds/LinuxMakefile/build/JX808.vst3"

      - name: Package
        run: |
          cd Binaries/Builds/LinuxMakefile/build
          OUT="$GITHUB_WORKSPACE/JX808-${{ steps.version.outputs.version }}-linux-x64-${{ matrix.target }}.zip"
          if [ "${{ matrix.target }}" = vst3 ]; then zip -r -q "$OUT" JX808.vst3; else zip -q "$OUT" JX808; fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: JX808-*-linux-x64-*.zip

  windows:
    needs: linux
    runs-on: windows-2022
    strategy:
      matrix:
        target: [vst3, standalone]
    steps:
      - uses: actions/checkout@v4

      - name: HISE 4.1.0 source (+ patches)
        shell: bash
        run: .github/hise-setup.sh

      - uses: actions/download-artifact@v4
        with:
          name: win-project-${{ matrix.target }}

      - name: Rewrite Linux paths in the exported project
        shell: bash
        run: |
          tar xzf win-project.tgz
          LINUX_ROOT="$(cat Binaries/linux-root.txt)"
          WIN_ROOT="$(cd .. && pwd -W)"
          echo "$LINUX_ROOT -> $WIN_ROOT"
          sed -i "s#$LINUX_ROOT#$WIN_ROOT#g" Binaries/AutogeneratedProject.jucer
          grep -c "$WIN_ROOT" Binaries/AutogeneratedProject.jucer

      - uses: microsoft/setup-msbuild@v2

      - name: Compile (Windows)
        shell: bash
        run: |
          cd Binaries
          ../../HISE/source/tools/projucer/Projucer.exe --resave AutogeneratedProject.jucer
          ls Builds
          SLN="$(ls Builds/VisualStudio2022/*.sln | head -1)"
          MSBuild.exe "$SLN" -p:Configuration=Release -p:Platform=x64 -m -verbosity:minimal

      - name: Validate (pluginval)
        if: matrix.target == 'vst3'
        shell: bash
        run: |
          curl -L --fail -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip
          7z x -y pluginval.zip > /dev/null
          ./pluginval.exe --strictness-level 5 --timeout-ms 600000 \
            --validate "$(find Binaries/Compiled -name 'JX808.vst3' | head -1)"

      - name: Package
        shell: bash
        run: |
          # MSBuild writes the plugin (a single DLL named JX808.vst3) or JX808.exe to Binaries/Compiled
          if [ "${{ matrix.target }}" = vst3 ]; then NAME=JX808.vst3; else NAME=JX808.exe; fi
          OUT="$(find Binaries/Compiled -name "$NAME" | head -1)"
          echo "$OUT"
          test -n "$OUT"
          cd "$(dirname "$OUT")"
          7z a -tzip "$GITHUB_WORKSPACE/JX808-${{ needs.linux.outputs.version }}-windows-x64-${{ matrix.target }}.zip" "$NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}
          path: JX808-*-windows-x64-*.zip

  release:
    needs: [linux, windows]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{linux,windows}-*"
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.linux.outputs.version) }}
          name: JX808 ${{ needs.linux.outputs.version }}
          files: JX808-*.zip
          generate_release_notes: true
